apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring

spec:
  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      tolerations:
       - key: node-role.kubernetes.io/control-plane
         operator: Exists
         effect: NoSchedule

       - key: workload
         operator: Exists
         effect: NoSchedule

      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
