apiVersion: v1
kind: Pod
metadata:
  name: log-test
spec:
  containers:
    - name: logger
      image: busybox
      command: ["sh", "-c", "while true; do echo \"$(date) - hello from pod\" >> /var/log/app/app.log; sleep 5; done"]
      volumeMounts:
        - name: logs-vol
          mountPath: /var/log/app
  volumes:
    - name: logs-vol
      persistentVolumeClaim:
        claimName: ivolvepvc
