apiVersion: apps/v1
kind: Deployment
metadata: 
  name: ivolveapp
  namespace: ivolve
spec:
  replicas: 2
  strategy:       
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable:   
  selector:
    matchLabels:
      app: ivolveapp
  template:
    metadata:
      labels:
       app: ivolveapp      
    spec: 
      nodeSelector:
        project: ivolve
      tolerations:
        - key: workload
          operator: Equal
          value: ivolveApp
          effect: NoSchedule
      initContainers:
      - name: init-db
        image: mysql:latest
        env:
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: ivolvecm
                key: DB_HOST
          - name: MYSQL_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ivolvesecret
                key: MYSQL_ROOT_PASSWORD
          - name: DB_USER
            valueFrom: 
              configMapKeyRef:
                name: ivolvecm
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ivolvesecret
                key: DB_PASSWORD
        command:
            - "sh"
            - "-c"
            - |
              until mysql -h "$DB_HOST" -u root -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1;" > /dev/null 2>&1; do
                echo "Waiting for MySQL at $DB_HOST to be ready..."
                sleep 3
              done
              mysql -h "$DB_HOST" -u root -p"$MYSQL_ROOT_PASSWORD" -e "CREATE DATABASE IF NOT EXISTS ivolve; CREATE USER IF NOT EXISTS '$DB_USER'@'%' IDENTIFIED BY '$DB_PASSWORD'; GRANT ALL PRIVILEGES ON ivolve.* TO '$DB_USER'@'%'; FLUSH PRIVILEGES;"
              echo "Database ivolve initialized and privileges granted to $DB_USER."
      containers:
        - name: myapp
          image: essammo22/ivolve-app:v1
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"    
                
          ports:
            - containerPort: 3000
          env:
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: ivolvecm
                key: DB_HOST  
          - name: DB_USER
            valueFrom: 
              configMapKeyRef:
                name: ivolvecm
                key: DB_USER 
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ivolvesecret
                key: DB_PASSWORD 
          volumeMounts:
              - name: app-volume
                mountPath: /app/logs
      volumes:
        - name: app-volume
          persistentVolumeClaim:
            claimName: ivolvepvc                      

                
